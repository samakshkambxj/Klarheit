name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDM" --licenses > /dev/null
          "$SDM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/release/*.apk

  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDM" --licenses > /dev/null
          "$SDM" "ndk;28.2.13676358"

      - name: Build driver + Magisk zips
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$SDK/ndk/28.2.13676358"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            make -C drivers/klarheit libs zip VERSION_NAME="$TAG" VERSION_CODE="$GITHUB_RUN_NUMBER"
          else
            make -C drivers/klarheit libs zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: driver-zips
          path: drivers/klarheit/out/*.zip

  release:
    needs: [app, driver]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-apks
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: driver-zips
          path: dist/

      - name: Rename assets
        run: |
          cd dist
          TAG="${GITHUB_REF#refs/tags/}"
          for f in app-release*.apk; do
            [ -e "$f" ] && mv "$f" "Klarheit-${TAG}.apk"
          done
          for f in *.zip; do
            case "$f" in
              Klarheit*) ;;
              *) mv "$f" "KlarheitDSP-${TAG}-${f}" ;;
            esac
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
